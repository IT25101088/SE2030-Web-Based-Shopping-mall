# --- Database connection ---
# Local dev MySQL: root user, no password (fine for a local academic project).
spring.datasource.url=jdbc:mysql://localhost:3306/shopping_mall?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# --- JPA / Hibernate ---
# 'update' lets Hibernate create/alter tables from our @Entity classes automatically during development.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- JSP view resolver ---
# Controllers return a String like "auth/login" and Spring resolves it to this path.
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# --- Session ---
server.servlet.session.timeout=30m
