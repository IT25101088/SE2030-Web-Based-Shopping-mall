# --- Server ---
# 8080 is taken by a local Tomcat 9 service, so the app runs on 8081.
server.port=8081

# --- Database connection ---
# Local dev MySQL: defaults to root with no password. Override per machine with the
# DB_USERNAME / DB_PASSWORD environment variables instead of editing this file.
spring.datasource.url=jdbc:mysql://localhost:3306/shopping_mall?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# --- JPA / Hibernate ---
# 'update' lets Hibernate create/alter tables from our @Entity classes automatically during development.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- JSP view resolver ---
# Controllers return a String like "auth/login" and Spring resolves it to this path.
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# --- Session ---
server.servlet.session.timeout=30m

# Simulated payments (see order/payment). Set false to make card and bank transfer
# payments decline, to try the declined-payment flow. Cash on delivery always succeeds.
mall.payment.dummy.always-succeed=true

# Cart price rules (see cart/pricing). Amounts are in rupees.
mall.pricing.delivery-fee=350
mall.pricing.free-delivery-from=10000
mall.pricing.discount-from=50000
mall.pricing.discount-percent=5

# How star ratings are combined into a product's / shop's score (see feedback/rating):
# simple = plain average; recency-weighted = newer reviews count for more.
mall.rating.strategy=simple
